# ==============================================================================
# Shiksha ERP — Production Configuration Profile (application-prod.properties)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always

# Production MySQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shiksha_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shiksha_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shiksha_password}

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Production Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Security & Console Disabling
spring.h2.console.enabled=false

# Thymeleaf Caching Enabled in Production
spring.thymeleaf.cache=true

# Logging
logging.level.root=WARN
logging.level.com.shiksha.erp=INFO
logging.level.org.springframework.security=WARN
