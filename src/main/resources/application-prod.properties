# ==============================================================================
# Shiksha ERP — Production Configuration Profile (application-prod.properties)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always

# Production Database Connection (Defaults to persistent H2 in MySQL mode; auto-detects driver for MySQL/PostgreSQL/H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shiksha_erp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE,KEY,MONTH,YEAR,DATE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hikari Connection Pool Settings (Optimized for cloud container memory)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Production Hibernate & JPA (Dialect is auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Security & Console Disabling
spring.h2.console.enabled=false

# Thymeleaf Caching Enabled in Production
spring.thymeleaf.cache=true

# Logging
logging.level.root=WARN
logging.level.com.shiksha.erp=INFO
logging.level.org.springframework.security=WARN
