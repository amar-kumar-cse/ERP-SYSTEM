<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Monthly Fee - Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="erp-container">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content Wrapper -->
    <div class="erp-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar('Fee Administration')}"></div>

        <div class="erp-content">
            <!-- Breadcrumbs -->
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <a th:href="@{/admin/fee}" class="btn btn-sm btn-erp-outline">
                    <i class="bi bi-arrow-left me-1"></i> Back to Fee Records
                </a>
            </div>

            <div class="row">
                <div class="col-12 col-lg-8 col-xl-6">
                    <div class="panel-card mb-4">
                        <div class="panel-header">
                            <h2 class="panel-title mb-0">Generate Monthly Fee Records</h2>
                        </div>
                        <div class="panel-body">
                            <!-- Flash Alerts -->
                            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                                <span th:text="${successMsg}">Success</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                                <span th:text="${errorMsg}">Error message</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <form th:action="@{/admin/fee/generate}" th:object="${feeGenerateDto}" method="post">
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-sm-6">
                                        <label for="month" class="form-label">Billing Month <span class="text-danger">*</span></label>
                                        <select id="month" th:field="*{month}" class="form-select form-control" required>
                                            <option value="1">January</option>
                                            <option value="2">February</option>
                                            <option value="3">March</option>
                                            <option value="4">April</option>
                                            <option value="5">May</option>
                                            <option value="6">June</option>
                                            <option value="7">July</option>
                                            <option value="8">August</option>
                                            <option value="9">September</option>
                                            <option value="10">October</option>
                                            <option value="11">November</option>
                                            <option value="12">December</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label for="year" class="form-label">Billing Year <span class="text-danger">*</span></label>
                                        <input type="number" id="year" th:field="*{year}" min="2020" max="2030" class="form-control" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-sm-6">
                                        <label for="amountDue" class="form-label">Fee Amount (₹) <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" id="amountDue" th:field="*{amountDue}" min="1" step="0.01" class="form-control" placeholder="1500.00" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label for="dueDate" class="form-label">Payment Due Date <span class="text-danger">*</span></label>
                                        <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="classBatchId" class="form-label">Target Students / Batch</label>
                                    <select id="classBatchId" th:field="*{classBatchId}" class="form-select form-control">
                                        <option value="">-- All Enrolled Students (Institute Wide) --</option>
                                        <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName}">Class 10</option>
                                    </select>
                                    <small class="text-muted d-block mt-1">
                                        <i class="bi bi-info-circle me-1"></i> Existing fee records for the same month and year will be automatically preserved (no duplicate billing).
                                    </small>
                                </div>

                                <div class="d-flex gap-2">
                                    <a th:href="@{/admin/fee}" class="btn btn-erp-outline">Cancel</a>
                                    <button type="submit" class="btn btn-erp-primary flex-fill py-2">
                                        <i class="bi bi-receipt me-1"></i> Generate Monthly Fee Records
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Manual Overdue Trigger Box -->
                    <div class="panel-card bg-light border">
                        <div class="panel-body d-flex justify-content-between align-items-center">
                            <div>
                                <h3 class="h6 fw-bold text-dark mb-1">Manual Overdue Check</h3>
                                <p class="text-secondary small mb-0">Scan and update all unpaid invoices past their due date to OVERDUE status.</p>
                            </div>
                            <form th:action="@{/admin/fee/generate-overdue}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger text-nowrap">
                                    <i class="bi bi-exclamation-triangle me-1"></i> Scan Overdue Now
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
