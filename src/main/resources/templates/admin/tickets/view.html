<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolve Ticket - Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="erp-container">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content Wrapper -->
    <div class="erp-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar('Ticket Details')}"></div>

        <div class="erp-content">
            <!-- Breadcrumbs -->
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <a th:href="@{/admin/tickets}" class="btn btn-sm btn-erp-outline">
                    <i class="bi bi-arrow-left me-1"></i> Back to All Tickets
                </a>
            </div>

            <!-- Flash Alerts -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <span th:text="${successMsg}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${errorMsg}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <div class="col-12 col-lg-8 col-xl-7">
                    <!-- Ticket Details Card -->
                    <div class="panel-card mb-4">
                        <div class="panel-header d-flex justify-content-between align-items-start">
                            <div>
                                <span class="text-secondary small font-monospace" th:text="'Ticket #' + ${ticket.id}">Ticket #1</span>
                                <h2 class="h5 fw-bold text-dark mb-1" th:text="${ticket.title}">Subject Line</h2>
                                <div class="text-muted small">
                                    Submitted by: <strong class="text-dark" th:text="${ticket.raisedByUsername}">parent1</strong>
                                    <span class="badge bg-light text-dark border ms-1" th:text="${ticket.raisedByRole}">PARENT</span>
                                    <span class="mx-2">•</span>
                                    <i class="bi bi-clock me-1"></i> <span th:text="${#temporals.format(ticket.createdAt, 'dd MMM yyyy, HH:mm')}">15 Aug 2026</span>
                                </div>
                            </div>

                            <div>
                                <span th:if="${ticket.status.name() == 'OPEN'}" class="badge-flat badge-warning-flat fs-6">
                                    <i class="bi bi-clock me-1"></i> OPEN
                                </span>
                                <span th:if="${ticket.status.name() == 'RESOLVED'}" class="badge-flat badge-success-flat fs-6">
                                    <i class="bi bi-check-circle me-1"></i> RESOLVED
                                </span>
                            </div>
                        </div>

                        <div class="panel-body">
                            <label class="form-label text-secondary small fw-bold">User's Message / Inquiry:</label>
                            <div class="p-3 bg-light rounded border text-dark mb-4" style="white-space: pre-wrap;" th:text="${ticket.message}">
                                Detailed query text here...
                            </div>

                            <!-- If Already Resolved -->
                            <div th:if="${ticket.status.name() == 'RESOLVED'}">
                                <div class="alert alert-success border-success">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="fw-bold"><i class="bi bi-shield-check me-1"></i> Admin Resolution Note</span>
                                        <small class="text-muted" th:text="'Resolved on: ' + ${#temporals.format(ticket.resolvedAt, 'dd MMM yyyy, HH:mm')}">15 Aug 2026</small>
                                    </div>
                                    <p class="mb-0 text-dark" style="white-space: pre-wrap;" th:text="${ticket.adminNote}">Resolution note text...</p>
                                </div>

                                <!-- Reopen Action -->
                                <form th:action="@{/admin/tickets/{id}/reopen(id=${ticket.id})}" method="post" class="mt-3">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" onclick="return confirm('Are you sure you want to reopen this support ticket?');">
                                        <i class="bi bi-arrow-counterclockwise me-1"></i> Reopen Ticket
                                    </button>
                                </form>
                            </div>

                            <!-- If OPEN: Resolution Form -->
                            <div th:if="${ticket.status.name() == 'OPEN'}">
                                <form th:action="@{/admin/tickets/{id}/resolve(id=${ticket.id})}" th:object="${ticketResolveDto}" method="post">
                                    <div class="mb-3">
                                        <label for="adminNote" class="form-label fw-bold">Resolution &amp; Reply Note <span class="text-danger">*</span></label>
                                        <textarea id="adminNote" th:field="*{adminNote}" class="form-control" rows="4" placeholder="Provide action details or resolution message to the user..." required maxlength="500"></textarea>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <a th:href="@{/admin/tickets}" class="btn btn-erp-outline">Cancel</a>
                                        <button type="submit" class="btn btn-success flex-fill">
                                            <i class="bi bi-check-circle-fill me-1"></i> Mark as Resolved &amp; Send Reply
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
