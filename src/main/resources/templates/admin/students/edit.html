<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="erp-container">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content Wrapper -->
    <div class="erp-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar('Edit Student Profile')}"></div>

        <div class="erp-content">
            <!-- Breadcrumbs / Back Link -->
            <div class="mb-3">
                <a th:href="@{/admin/students}" class="btn btn-sm btn-erp-outline">
                    <i class="bi bi-arrow-left me-1"></i> Back to Students List
                </a>
            </div>

            <!-- Error Banner -->
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${errorMsg}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Edit Student Form Card -->
            <div class="row">
                <div class="col-12 col-lg-8 col-xl-7">
                    <div class="panel-card">
                        <div class="panel-header">
                            <h2 class="panel-title">Update Student Information</h2>
                        </div>
                        <div class="panel-body">
                            <form th:action="@{/admin/students/edit/{id}(id=${studentId})}" th:object="${student}" method="post">
                                <!-- Student Personal Info -->
                                <h6 class="fw-bold text-secondary text-uppercase mb-3 pb-2 border-bottom" style="font-size: 0.75rem; letter-spacing: 0.5px;">Student Information</h6>
                                
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-7">
                                        <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                        <input type="text" id="name" th:field="*{name}" class="form-control" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>
                                    <div class="col-12 col-md-5">
                                        <label class="form-label">Roll Number</label>
                                        <input type="text" class="form-control bg-light" th:value="${rollNo}" readonly disabled>
                                        <small class="text-muted">Roll number cannot be changed</small>
                                    </div>
                                    <div class="col-12">
                                        <label for="classBatchId" class="form-label">Assigned Class Batch</label>
                                        <select id="classBatchId" th:field="*{classBatchId}" class="form-select form-control">
                                            <option value="">-- No batch assigned --</option>
                                            <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName + ' (' + b.timing + ')'}">Class 10 - Batch A</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Parent Details -->
                                <h6 class="fw-bold text-secondary text-uppercase mb-3 pb-2 border-bottom" style="font-size: 0.75rem; letter-spacing: 0.5px;">Parent Information</h6>

                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-6">
                                        <label for="parentName" class="form-label">Parent / Guardian Name</label>
                                        <input type="text" id="parentName" th:field="*{parentName}" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="parentPhone" class="form-label">Parent Contact Number</label>
                                        <input type="tel" id="parentPhone" th:field="*{parentPhone}" class="form-control">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Parent Portal Username</label>
                                        <input type="text" class="form-control bg-light" th:value="${parentUsername}" readonly disabled>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/admin/students}" class="btn btn-erp-outline">Cancel</a>
                                    <button type="submit" class="btn btn-erp-primary px-4">
                                        <i class="bi bi-save me-1"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
