<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Shiksha ERP</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-page-wrapper">
    <div class="login-bento-container" style="max-width: 520px; grid-template-columns: 1fr;">
        <div class="login-form-panel" style="padding: 3rem 2.5rem;">
            <div class="login-header text-center">
                <div class="stat-icon-wrapper icon-blue mx-auto mb-3" style="width: 52px; height: 52px;">
                    <i class="bi bi-key-fill fs-3"></i>
                </div>
                <h1 class="login-title">Reset Password</h1>
                <p class="login-subtitle">Enter your username or registered email to receive a secure recovery link</p>
            </div>

            <!-- Flash Info -->
            <div th:if="${infoMsg}" class="alert alert-info alert-dismissible fade show d-flex align-items-center py-2 px-3 mb-4" role="alert">
                <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                <div class="small" th:text="${infoMsg}">Reset link sent.</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label for="identifier" class="form-label">Username or Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
                        <input type="text" id="identifier" name="identifier" class="form-control border-start-0 ps-0" placeholder="e.g. parent1 or parent1@example.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="login-btn-submit mb-3">
                    <span>Send Recovery Link</span>
                    <i class="bi bi-send-fill ms-2"></i>
                </button>

                <div class="text-center">
                    <a th:href="@{/login}" class="text-secondary small fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
