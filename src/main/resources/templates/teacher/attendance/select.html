<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Attendance Batch - Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="erp-container">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content Wrapper -->
    <div class="erp-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar('Daily Attendance')}"></div>

        <div class="erp-content">
            <!-- Flash Message Alerts -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <span th:text="${successMsg}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${errorMsg}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="panel-card">
                        <div class="panel-header d-flex justify-content-between align-items-center">
                            <h2 class="panel-title mb-0">Select Class &amp; Date</h2>
                            <a th:href="@{/teacher/attendance/history}" class="btn btn-sm btn-erp-outline">
                                <i class="bi bi-clock-history me-1"></i> Attendance History
                            </a>
                        </div>
                        <div class="panel-body">
                            <!-- Empty Batches Warning -->
                            <div class="alert alert-warning d-flex align-items-center mb-3" th:if="${#lists.isEmpty(batches)}">
                                <i class="bi bi-exclamation-triangle me-2 fs-5"></i>
                                <span>No class batches assigned to your faculty account. Please request admin assignment.</span>
                            </div>

                            <form th:action="@{/teacher/attendance/mark}" method="get" th:if="${!#lists.isEmpty(batches)}">
                                <div class="mb-3">
                                    <label for="batchId" class="form-label">Select Class Batch <span class="text-danger">*</span></label>
                                    <select id="batchId" name="batchId" class="form-select form-control" required>
                                        <option value="">-- Choose Class Batch --</option>
                                        <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName + ' (' + b.timing + ')'}">Class 10</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="date" class="form-label">Attendance Date <span class="text-danger">*</span></label>
                                    <input type="date" id="date" name="date" th:value="${defaultDate}" class="form-control" th:max="${defaultDate}" required>
                                    <small class="text-muted d-block mt-1">
                                        <i class="bi bi-info-circle me-1"></i> If attendance for this date was previously taken, existing entries will automatically load for updating.
                                    </small>
                                </div>

                                <button type="submit" class="btn btn-erp-primary w-100 py-2">
                                    <i class="bi bi-arrow-right-circle me-1"></i> Proceed to Mark Attendance
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
