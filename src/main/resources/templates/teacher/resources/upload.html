<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Study Resource - Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="erp-container">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content Wrapper -->
    <div class="erp-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar('Upload Study Material')}"></div>

        <div class="erp-content">
            <!-- Breadcrumbs -->
            <div class="mb-3">
                <a th:href="@{/teacher/resources}" class="btn btn-sm btn-erp-outline">
                    <i class="bi bi-arrow-left me-1"></i> Back to Resources
                </a>
            </div>

            <div class="row">
                <div class="col-12 col-lg-8 col-xl-6">
                    <div class="panel-card">
                        <div class="panel-header">
                            <h2 class="panel-title mb-0">Add New Batch Resource</h2>
                        </div>
                        <div class="panel-body">
                            <!-- Error Banner -->
                            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                                <span th:text="${errorMsg}">Error message</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <form th:action="@{/teacher/resources/upload}" th:object="${resourceCreateDto}" method="post" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Resource Title <span class="text-danger">*</span></label>
                                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Chapter 4 Practice Worksheet (DPP)" required>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-sm-6">
                                        <label for="classBatchId" class="form-label">Target Batch <span class="text-danger">*</span></label>
                                        <select id="classBatchId" th:field="*{classBatchId}" class="form-select form-control" required>
                                            <option value="">-- Choose Batch --</option>
                                            <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName}">Class 10</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
                                        <input type="text" id="subject" th:field="*{subject}" class="form-control" placeholder="e.g. Mathematics" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Short Description (Optional)</label>
                                    <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Brief note about the shared material..."></textarea>
                                </div>

                                <!-- Resource Type Toggle -->
                                <div class="mb-3">
                                    <label class="form-label d-block">Resource Format <span class="text-danger">*</span></label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="resourceType" id="typeFile" value="FILE" th:field="*{resourceType}" onchange="toggleResourceType()">
                                        <label class="form-check-label" for="typeFile">
                                            <i class="bi bi-file-earmark-arrow-up me-1"></i> File Upload (PDF, Word, PPT, Image, ZIP)
                                        </label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="resourceType" id="typeLink" value="LINK" th:field="*{resourceType}" onchange="toggleResourceType()">
                                        <label class="form-check-label" for="typeLink">
                                            <i class="bi bi-link-45deg me-1"></i> External Web Link / Video
                                        </label>
                                    </div>
                                </div>

                                <!-- File Upload Container -->
                                <div id="fileUploadContainer" class="mb-4">
                                    <label for="file" class="form-label">Select File <span class="text-danger">*</span></label>
                                    <input type="file" id="file" name="file" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.jpg,.jpeg,.png,.txt">
                                    <small class="text-muted d-block mt-1">
                                        Maximum allowed file size: 10 MB. Supported formats: PDF, Word, PPT, Excel, ZIP, Images.
                                    </small>
                                </div>

                                <!-- External Link Container -->
                                <div id="linkUrlContainer" class="mb-4" style="display: none;">
                                    <label for="linkUrl" class="form-label">External Link / URL <span class="text-danger">*</span></label>
                                    <input type="url" id="linkUrl" th:field="*{linkUrl}" class="form-control" placeholder="https://youtube.com/watch?v=... or https://drive.google.com/...">
                                    <small class="text-muted d-block mt-1">
                                        Enter complete URL including https://
                                    </small>
                                </div>

                                <div class="d-flex gap-2">
                                    <a th:href="@{/teacher/resources}" class="btn btn-erp-outline">Cancel</a>
                                    <button type="submit" class="btn btn-erp-primary flex-fill">
                                        <i class="bi bi-cloud-arrow-up me-1"></i> Upload &amp; Share
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleResourceType() {
        const isFile = document.getElementById('typeFile').checked;
        const fileBox = document.getElementById('fileUploadContainer');
        const linkBox = document.getElementById('linkUrlContainer');

        if (isFile) {
            fileBox.style.display = 'block';
            linkBox.style.display = 'none';
        } else {
            fileBox.style.display = 'none';
            linkBox.style.display = 'block';
        }
    }

    document.addEventListener('DOMContentLoaded', toggleResourceType);
</script>
</body>
</html>
