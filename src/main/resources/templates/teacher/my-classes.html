<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Teaching Classes - Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="erp-container">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content Wrapper -->
    <div class="erp-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar('My Assigned Classes')}"></div>

        <div class="erp-content">
            <!-- Flash Message Alerts -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <span th:text="${successMsg}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${errorMsg}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Header Title -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h4 fw-bold mb-1">Assigned Class Batches</h2>
                    <p class="text-secondary small mb-0">Classes where you are assigned as teaching faculty</p>
                </div>
                <span class="badge-flat badge-info-flat" th:text="${#lists.size(batches) + ' Batches Total'}">0 Batches</span>
            </div>

            <!-- Empty State -->
            <div class="panel-card p-5 text-center" th:if="${#lists.isEmpty(batches)}">
                <i class="bi bi-collection-play fs-1 text-secondary mb-3 d-block"></i>
                <h5 class="fw-bold">No Class Batches Assigned</h5>
                <p class="text-muted small">Please contact administration to assign class batches to your account.</p>
            </div>

            <!-- Classes Grid -->
            <div class="row g-3" th:if="${!#lists.isEmpty(batches)}">
                <div class="col-12 col-md-6 col-xl-4" th:each="b : ${batches}">
                    <div class="panel-card h-100 d-flex flex-direction-column justify-content-between mb-0">
                        <div class="panel-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h3 class="h6 fw-bold text-dark mb-0" th:text="${b.batchName}">Class 10 - Batch A</h3>
                                <span class="badge-flat badge-success-flat" th:text="${b.studentCount + ' Students'}">12 Students</span>
                            </div>

                            <div class="text-secondary small mb-3">
                                <div class="mb-1"><i class="bi bi-clock me-1"></i> <span th:text="${b.timing}">4:00 PM - 6:00 PM</span></div>
                                <div><i class="bi bi-calendar3 me-1"></i> <span th:text="${b.days}">Mon, Wed, Fri</span></div>
                            </div>
                        </div>

                        <div class="p-3 bg-light border-top d-flex gap-2">
                            <a th:href="@{/teacher/my-classes/{id}/students(id=${b.id})}" class="btn btn-sm btn-erp-outline flex-fill text-center">
                                <i class="bi bi-people me-1"></i> Student Roster
                            </a>
                            <a th:href="@{/teacher/attendance/mark(batchId=${b.id})}" class="btn btn-sm btn-erp-primary flex-fill text-center">
                                <i class="bi bi-calendar2-check me-1"></i> Attendance
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
