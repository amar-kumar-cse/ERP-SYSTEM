<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Shiksha ERP</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-page-wrapper">
    <div class="login-bento-container" style="max-width: 520px; grid-template-columns: 1fr;">
        <div class="login-form-panel" style="padding: 3rem 2.5rem;">
            <!-- Invalid Token State -->
            <div th:if="${tokenInvalid}" class="text-center py-4">
                <div class="stat-icon-wrapper icon-rose mx-auto mb-3" style="width: 58px; height: 58px;">
                    <i class="bi bi-exclamation-triangle-fill fs-3"></i>
                </div>
                <h2 class="h5 fw-bold text-danger mb-2">Link Expired or Invalid</h2>
                <p class="text-secondary small mb-4">This password reset link is invalid, has already been used, or has expired (15 minutes limit).</p>
                <a th:href="@{/forgot-password}" class="btn btn-erp-primary rounded-pill px-4">
                    Request New Link
                </a>
            </div>

            <!-- Valid Token Form -->
            <div th:if="${!tokenInvalid}">
                <div class="login-header text-center">
                    <div class="stat-icon-wrapper icon-green mx-auto mb-3" style="width: 52px; height: 52px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h1 class="login-title">Set New Password</h1>
                    <p class="login-subtitle">Please create a strong new password for your account</p>
                </div>

                <!-- Error Msg -->
                <div th:if="${errorMsg}" class="alert alert-danger py-2 px-3 mb-3 small" th:text="${errorMsg}">
                    Password error
                </div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="Minimum 6 characters" required minlength="6" autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control border-start-0 ps-0" placeholder="Re-enter password" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="login-btn-submit mb-3">
                        <span>Save &amp; Sign In</span>
                        <i class="bi bi-check2-circle ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
