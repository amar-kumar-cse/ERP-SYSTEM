<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Shiksha ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <style>
        body {
            background-color: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            font-size: 3.5rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .error-desc {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-icon">
        <i class="bi bi-exclamation-octagon-fill"></i>
    </div>
    <h1 class="error-code">500</h1>
    <h2 class="h5 fw-bold text-dark mb-2">Unexpected Server Error</h2>
    <p class="error-desc" th:text="${errorMessage}">An unexpected system error occurred on the server. Please try again after some time.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="javascript:history.back()" class="btn btn-erp-outline">
            <i class="bi bi-arrow-left me-1"></i> Go Back
        </a>
        <a th:href="@{/dashboard}" class="btn btn-erp-primary">
            <i class="bi bi-house-door me-1"></i> Dashboard
        </a>
    </div>
</div>

</body>
</html>
