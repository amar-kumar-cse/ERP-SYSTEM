# Application Info
spring.application.name=Shiksha ERP
server.port=8080

# Database Configuration (Local Persistent DB with MySQL mode compatibility)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shiksha_erp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE,KEY,MONTH,YEAR,DATE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# H2 Console (Available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Fee Management Configuration
app.fee.default-amount=1500

# Razorpay Payment Gateway Configuration (Test / Sandbox Mode)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_shiksha1234}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_secret_shiksha5678}

# Mail Configuration (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:admin@shikshaerp.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:notifications@shikshaerp.com}
app.notifications.admin-email=${APP_NOTIFICATIONS_ADMIN_EMAIL:admin@shikshaerp.com}

# Institute Metadata for PDF Exports
app.institute.name=Shiksha Academy
app.institute.tagline=Empowering Students to Excel
app.institute.phone=+91 98765 43210
app.institute.email=support@shikshaerp.com
app.institute.address=102 Knowledge Park, Tech City, New Delhi - 110001

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.com.shiksha.erp=INFO
