# Application Info
spring.application.name=Shiksha ERP
server.port=8080

# Database Configuration (Local Persistent DB with MySQL mode compatibility)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shiksha_erp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE,KEY,MONTH,YEAR,DATE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# H2 Console (Available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Fee Management Configuration
app.fee.default-amount=1500

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.com.shiksha.erp=INFO
