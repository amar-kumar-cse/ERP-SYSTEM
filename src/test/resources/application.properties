spring.application.name=Shiksha ERP Test

# In-Memory H2 DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE,KEY,MONTH,YEAR,DATE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test mail and upload properties
app.mail.enabled=false
app.upload.dir=./target/test-uploads
razorpay.key.id=rzp_test_dummy
razorpay.key.secret=rzp_secret_dummy
